name: Nova OS kernel build

on:
  push:
    branches:
      - main
      - "bootstrap/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make qemu-system-arm

      - name: Build AArch64 kernel and diagnostic test image
        run: |
          make -C kernel clean all test

      - name: Inspect ELF images
        run: |
          file kernel/build/nova.elf
          file kernel/build/nova-test.elf
          readelf -h kernel/build/nova.elf
          readelf -sW kernel/build/nova.elf | grep -E '__bss_start|__bss_end|_start|exception_vectors_el1'

      - name: QEMU serial boot smoke test
        shell: bash
        run: |
          set +e
          timeout 8s qemu-system-aarch64 \
            -machine virt \
            -cpu cortex-a57 \
            -nographic \
            -kernel kernel/build/nova.elf > qemu.log 2>&1
          status=$?
          set -e
          cat qemu.log
          if ! grep -q "Welcome to Nova OS" qemu.log; then
            echo "Expected serial banner was not observed (QEMU exit: $status)."
            exit 1
          fi
          if ! grep -Eq "CurrentEL: EL[0-3]" qemu.log; then
            echo "Current exception level was not reported."
            exit 1
          fi
          if ! grep -q "BSS zero initialization verified." qemu.log; then
            echo "BSS initialization probe failed or was not observed."
            exit 1
          fi
          echo "Nova OS normal boot checks passed."

      - name: QEMU controlled exception test
        shell: bash
        run: |
          set +e
          timeout 8s qemu-system-aarch64 \
            -machine virt \
            -cpu cortex-a57 \
            -nographic \
            -kernel kernel/build/nova-test.elf > exception.log 2>&1
          status=$?
          set -e
          cat exception.log
          if ! grep -q "Triggering controlled SVC exception test." exception.log; then
            echo "Controlled exception was not triggered (QEMU exit: $status)."
            exit 1
          fi
          if ! grep -q "EXCEPTION: EL1 vector captured." exception.log; then
            echo "EL1 exception vector did not capture the exception."
            exit 1
          fi
          if ! grep -q "Vector: Current EL SPx synchronous" exception.log; then
            echo "The synchronous EL1 SPx vector was not identified."
            exit 1
          fi
          if ! grep -Eq "ESR_EL1: 0x[0-9A-F]{16}" exception.log; then
            echo "ESR_EL1 diagnostic was not printed."
            exit 1
          fi
          if ! grep -Eq "ELR_EL1: 0x[0-9A-F]{16}" exception.log; then
            echo "ELR_EL1 diagnostic was not printed."
            exit 1
          fi
          echo "Nova OS controlled EL1 exception test passed."
